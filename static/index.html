<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global & National Crisis Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; margin: 0; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 30px; }
        .header h1 { color: #ff4444; margin-bottom: 5px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; max-width: 1300px; margin: auto; }
        .lang-card { background: #1e1e1e; border-top: 4px solid #00bcd4; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .lang-title { font-size: 1.2em; font-weight: bold; color: #00bcd4; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        .crisis-box { background: #3e1f1f; border: 1px solid #ff4444; border-radius: 6px; padding: 15px; margin-top: 10px; }
        .crisis-headline { font-size: 1.1em; font-weight: bold; color: #ff8888; margin-bottom: 10px; }
        .no-crisis { background: #1b4332; border: 1px solid #2d6a4f; padding: 15px; border-radius: 6px; color: #a3b18a; text-align: center; }
        
        .metric { font-weight: bold; color: #ffca28; }
        .threat-tag { display: inline-block; background: #ff4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; margin-right: 4px; margin-top: 5px; }

        /* Ingestion Panel */
        .ingest-panel { max-width: 1300px; margin: 40px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border-top: 4px solid #007bff; }
        textarea { width: 100%; height: 120px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 5px; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
        select, input[type="text"] { padding: 8px; background: #2d2d2d; color: white; border: 1px solid #444; margin-bottom: 15px; margin-right: 15px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚨 Global & National Crisis Monitor</h1>
    <p>Real-time tracking of the single most concerning news article across 6 major languages</p>
</div>

<!-- 6 LANGUAGE CRISIS GRID -->
<div class="grid-container" id="crisisGrid">
    <!-- Populated dynamically via JavaScript -->
</div>

<!-- INGESTION TOOL TO TEST & PUSH NEW CRISIS ARTICLES -->
<div class="ingest-panel">
    <h2>Test & Ingest Article</h2>
    <p style="color: #aaa; font-size: 0.9em;">Paste an article snippet in any language to test if it overrides the top concerning news for that region.</p>
    
    <div>
        <label>Language Region:</label>
        <select id="inputLang">
            <option value="bn">Bangla (বাংলা)</option>
            <option value="en">English</option>
            <option value="es">Spanish (Español)</option>
            <option value="de">German (Deutsch)</option>
            <option value="fr">French (Français)</option>
            <option value="ar">Arabic (العربية)</option>
        </select>
        
        <label>Title:</label>
        <input type="text" id="inputTitle" placeholder="Article headline..." style="width: 300px;">
    </div>

    <textarea id="inputText" placeholder="Paste article content containing crisis keywords (e.g., earthquake, flood, attack, emergency)..."></textarea>
    <button onclick="submitArticle()">Publish / Evaluate Article</button>
</div>

<script>
    const langNames = {
        "bn": "Bangla (বাংলা)",
        "en": "English",
        "es": "Spanish (Español)",
        "de": "German (Deutsch)",
        "fr": "French (Français)",
        "ar": "Arabic (العربية)"
    };

    window.onload = function() {
        fetchAllFocus();
    };

    async function fetchAllFocus() {
        try {
            const response = await fetch('/top-focus-all');
            const data = await response.json();
            const grid = document.getElementById('crisisGrid');
            grid.innerHTML = '';

            for (const [langCode, article] of Object.entries(data.top_articles)) {
                const card = document.createElement('div');
                card.className = 'lang-card';
                
                let contentHTML = `<div class="lang-title">${langNames[langCode] || langCode}</div>`;

                if (article) {
                    let tagsHTML = '';
                    article.threat_categories.forEach(tag => {
                        tagsHTML += `<span class="threat-tag">${tag.replace(/_/g, ' ')}</span>`;
                    });

                    contentHTML += `
                        <div class="crisis-box">
                            <div class="crisis-headline">${article.title}</div>
                            <p style="font-size: 0.9em; margin: 5px 0;"><strong>Threat Score:</strong> <span class="metric">${article.concern_score}</span>/100</p>
                            <p style="font-size: 0.8em; color: #aaa; margin: 5px 0;"><strong>Time:</strong> ${new Date(article.timestamp).toLocaleTimeString()}</p>
                            <div>${tagsHTML}</div>
                        </div>
                    `;
                } else {
                    contentHTML += `
                        <div class="no-crisis">
                            ✅ Status Clear<br><small>No major national/global crises reported in the last 24h.</small>
                        </div>
                    `;
                }

                card.innerHTML = contentHTML;
                grid.appendChild(card);
            }
        } catch (error) {
            console.error("Error fetching crisis feed", error);
        }
    }

    async function submitArticle() {
        const lang = document.getElementById('inputLang').value;
        const title = document.getElementById('inputTitle').value || "Breaking Update";
        const text = document.getElementById('inputText').value;

        if (!text) { alert("Please enter article text."); return; }

        try {
            const response = await fetch('/ingest-global', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: "test_" + Date.now(), title: title, text: text, language: lang })
            });

            if (response.ok) {
                document.getElementById('inputText').value = '';
                document.getElementById('inputTitle').value = '';
                alert("Article evaluated successfully!");
                fetchAllFocus(); // Refresh the grid
            }
        } catch (error) {
            alert("Failed to submit article.");
        }
    }
</script>

</body>
</html>
